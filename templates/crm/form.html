{% extends "base.html" %}
{% block extra_head %}{{ form.media }}{% endblock %}
{% block content %}
<section class="max-w-xl mx-auto px-4 py-10">
  <h1 class="text-xl font-extrabold mb-6 text-center">{{ title }}</h1>
  <form method="post" class="bg-white rounded-3xl shadow-lg border p-6 space-y-4">
    {% csrf_token %}
    {% include "crm/_form_fields.html" %}
    <button class="w-full rounded-xl bg-brand-blue-600 hover:bg-brand-blue-700 text-white font-bold py-3">ذخیره</button>
    {% if extra_button %}
    <button name="save_add_task" value="1" class="w-full rounded-xl border border-brand-blue-600 text-brand-blue-700 hover:bg-brand-blue-50 font-bold py-3">{{ extra_button }}</button>
    {% endif %}
  </form>
</section>
{% endblock %}
