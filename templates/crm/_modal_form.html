<div class="fixed inset-0 z-[60] flex items-center justify-center p-4" role="dialog" aria-modal="true">
  <div class="absolute inset-0 bg-slate-900/50" onclick="closeModal()"></div>
  <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
    <div class="sticky top-0 z-10 flex items-center justify-between px-6 py-4 border-b bg-white rounded-t-2xl">
      <h2 class="font-extrabold">{{ title }}</h2>
      <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl leading-none" aria-label="بستن">✕</button>
    </div>
    <form method="post" action="{{ action }}"
          hx-post="{{ action }}" hx-target="#modal-root" hx-swap="innerHTML"
          class="p-6 space-y-1">
      {% csrf_token %}
      {% include "crm/_form_fields.html" %}
      <button type="submit"
              class="mt-6 w-full rounded-xl bg-brand-blue-600 hover:bg-brand-blue-700 text-white font-bold py-3">
        ذخیره
      </button>
    </form>
    {{ form.media }}
  </div>
</div>
