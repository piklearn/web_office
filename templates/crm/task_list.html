{% extends "base.html" %}
{% block content %}
<section class="max-w-4xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-extrabold mb-4">همهٔ کارهای باز</h1>
  <div class="flex flex-wrap gap-2 mb-4 text-sm">
    <a href="?" class="rounded-lg px-3 py-1 border {% if not current %}bg-brand-blue-600 text-white{% endif %}">همه</a>
    {% for v, l in statuses %}<a href="?status={{ v }}" class="rounded-lg px-3 py-1 border {% if current == v %}bg-brand-blue-600 text-white{% endif %}">{{ l }}</a>{% endfor %}
  </div>
  <div class="space-y-2">{% for t in tasks %}{% include "crm/_task_row.html" %}{% empty %}<p class="text-slate-400">موردی نیست.</p>{% endfor %}</div>
</section>
{% endblock %}
