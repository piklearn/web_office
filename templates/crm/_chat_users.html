{% for u in chat_users %}
  <a href="{% url 'crm:dashboard' %}?chat={{ u.pk }}"
    class="inline-flex items-center gap-1 text-[11px] rounded-full border px-2.5 py-1 transition
            {% if active_chat_user and active_chat_user.pk == u.pk %}bg-stone-800 text-white border-stone-800
            {% else %}bg-white text-stone-600 border-stone-200 hover:border-stone-400{% endif %}">
    {{ u.get_full_name|default:u.username }}
    {% if u.unread_count %}
    <span class="min-w-[1.1rem] h-4 px-1 rounded-full text-[10px] font-bold
                flex items-center justify-center
                {% if active_chat_user and active_chat_user.pk == u.pk %}bg-white text-stone-800
                {% else %}bg-red-500 text-white{% endif %}">
      {{ u.unread_count }}
    </span>
    {% endif %}
  </a>
{% empty %}
<span class="text-[11px] text-stone-400 px-2">همکاری نیست</span>
{% endfor %}
