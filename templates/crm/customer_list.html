{% extends "base.html" %}
{% block content %}
<section class="max-w-5xl mx-auto px-4 py-10">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-extrabold">مشتریان</h1>
    <a href="{% url 'crm:customer_add' %}" class="rounded-xl bg-brand-blue-600 text-white px-4 py-2 text-sm font-bold">+ مشتری جدید</a>
  </div>
  <form method="get" class="bg-white border rounded-2xl p-4 mb-4 grid grid-cols-1 md:grid-cols-4 gap-2 text-sm">
    <input name="q" value="{{ q }}" placeholder="نام، موبایل، کد ملی، شرکت، نرم‌افزار" class="md:col-span-2 rounded-xl border px-3 py-2">
    <select name="status" class="rounded-xl border px-3 py-2"><option value="">همهٔ وضعیت‌ها</option>
      {% for v, l in statuses %}<option value="{{ v }}" {% if status == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
    <select name="software" class="rounded-xl border px-3 py-2"><option value="">همهٔ نرم‌افزارها</option>
      {% for s in softwares %}<option value="{{ s.pk }}" {% if software == s.pk|stringformat:"s" %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select>
    <select name="filter" class="rounded-xl border px-3 py-2 md:col-span-3"><option value="">فیلتر سریع</option>
      <option value="new" {% if flt == "new" %}selected{% endif %}>مشتریان جدید</option>
      <option value="open_requests" {% if flt == "open_requests" %}selected{% endif %}>دارای درخواست باز</option>
      <option value="no_followup" {% if flt == "no_followup" %}selected{% endif %}>بدون پیگیری</option>
      <option value="waiting" {% if flt == "waiting" %}selected{% endif %}>منتظر پاسخ</option>
      {% if finance %}<option value="debtor" {% if flt == "debtor" %}selected{% endif %}>بدهکار</option>{% endif %}</select>
    <button class="rounded-xl bg-slate-800 text-white font-bold">جستجو</button>
  </form>
  <div class="space-y-2">
    {% for c in customers %}
    <a href="{% url 'crm:customer_detail' c.pk %}" class="flex items-center justify-between bg-white rounded-xl border px-4 py-3 hover:border-brand-blue-400">
      <div><div class="font-bold">{{ c }}</div><div class="text-xs text-slate-400">{{ c.full_name }} · {{ c.mobile }} · {{ c.get_status_display }}</div></div>
      {% if c.open_tasks_count %}<span class="text-xs rounded-full bg-orange-100 text-orange-700 px-3 py-1">{{ c.open_tasks_count }} کار باز</span>{% endif %}
    </a>
    {% empty %}<p class="text-slate-400">موردی پیدا نشد.</p>{% endfor %}
  </div>
</section>
{% endblock %}
