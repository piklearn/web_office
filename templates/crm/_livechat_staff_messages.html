{% for m in messages_list %}
<div class="flex {% if m.is_from_visitor %}justify-end{% else %}justify-start{% endif %}">
  <div class="max-w-[80%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm
              {% if m.is_from_visitor %}
                bg-brand-blue-600 text-white rounded-bl-md
              {% else %}
                bg-stone-100 text-stone-800 rounded-br-md
              {% endif %}">
    {% if not m.is_from_visitor %}
    <div class="text-[10px] font-bold text-stone-500 mb-0.5">
      {% if m.staff %}
        {{ m.staff.get_full_name|default:m.staff.username }}
      {% else %}
        پشتیبانی
      {% endif %}
    </div>
    {% else %}
    <div class="text-[10px] font-bold opacity-80 mb-0.5">بازدیدکننده</div>
    {% endif %}
    <div class="whitespace-pre-wrap break-words">{{ m.text }}</div>
    <div class="text-[9px] opacity-60 mt-1 tabular-nums" dir="ltr">{{ m.created_at|time:"H:i" }}</div>
  </div>
</div>
{% empty %}
<p class="text-xs text-stone-400 text-center py-10">پیامی نیست.</p>
{% endfor %}
