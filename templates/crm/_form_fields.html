{% for field in form %}
  <div>
    <label class="block text-sm font-bold text-slate-700 mb-1">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="text-xs text-slate-400 mt-1">{{ field.help_text }}</p>{% endif %}
    {% for e in field.errors %}<p class="text-xs text-red-500 mt-1">{{ e }}</p>{% endfor %}
  </div>
{% endfor %}
{% for e in form.non_field_errors %}<p class="text-xs text-red-500">{{ e }}</p>{% endfor %}
