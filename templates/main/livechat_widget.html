{% load static %}
{# ویجت شناور چت آنلاین #}
<div id="livechat-root" class="fixed bottom-5 right-5 z-[60] flex flex-col items-start gap-3"
     style="direction: rtl;">

  <div id="livechat-panel"
       class="{% if not open_panel and not conversation %}hidden{% endif %} w-[340px] max-w-[calc(100vw-2.5rem)]
              bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden"
       style="height: 420px;">
    {% if conversation %}
      {% include "main/livechat_panel.html" %}
    {% else %}
      <div class="flex flex-col h-full">
        <div class="flex items-center justify-between px-4 py-3 bg-gradient-to-l from-brand-blue-600 to-brand-blue-700 text-white rounded-t-2xl">
          <div class="flex items-center gap-2">
            <span class="text-lg">💬</span>
            <div>
              <div class="text-sm font-bold">چت با تیم دفتر</div>
              <div class="text-[10px] opacity-80">معمولاً در چند دقیقه پاسخ می‌دهیم</div>
            </div>
          </div>
          <button type="button" onclick="document.getElementById('livechat-panel').classList.add('hidden')"
                  class="w-8 h-8 rounded-full hover:bg-white/20 flex items-center justify-center transition">✕</button>
        </div>
        <div class="flex-1 p-4 flex flex-col justify-center">
          <p class="text-sm text-slate-600 mb-4 text-center leading-relaxed">
            برای شروع گفتگو، نام خود را وارد کنید.
          </p>
          <form hx-post="{% url 'main:livechat_start' %}"
      hx-target="#livechat-panel"
      hx-swap="innerHTML"
      hx-on::after-swap="if(window.initFloatLabels)initFloatLabels(document.getElementById('livechat-panel'))"
      class="space-y-5">
  {% csrf_token %}
  <div class="float-field">
    <input type="text" name="visitor_name" id="livechat_visitor_name"
           required maxlength="100" autocomplete="name"
           placeholder=" ">
    <label for="livechat_visitor_name" class="float-label">نام شما <span class="text-red-500">*</span></label>
  </div>
  <div class="float-field">
    <input type="tel" name="visitor_phone" id="livechat_visitor_phone"
           maxlength="30" autocomplete="tel" dir="ltr"
           placeholder=" ">
    <label for="livechat_visitor_phone" class="float-label">شماره تماس (اختیاری)</label>
  </div>
  <button type="submit"
          class="w-full rounded-xl bg-brand-blue-600 hover:bg-brand-blue-700 text-white
                 font-bold py-2.5 text-sm transition shadow-md hover:shadow-lg">
    شروع گفتگو
  </button>
</form>
        </div>
      </div>
    {% endif %}
  </div>

  <button type="button" id="livechat-fab"
          onclick="(function(){
            var p=document.getElementById('livechat-panel');
            var willOpen=p.classList.contains('hidden');
            p.classList.toggle('hidden');
            if(willOpen && window.LiveChatSound){ LiveChatSound.open(); }
            var m=document.getElementById('livechat-messages');
            if(m){ m.scrollTop=m.scrollHeight; if(window.LiveChatSound) LiveChatSound.resetCount(m); }
          })()"
          class="group flex items-center gap-2 rounded-full bg-brand-blue-600 hover:bg-brand-blue-700
                 text-white shadow-lg hover:shadow-xl transition-all duration-300 hover:-translate-y-0.5
                 pr-5 pl-4 py-3.5">
    <span class="relative flex h-3 w-3">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-3 w-3 bg-green-400"></span>
    </span>
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
    </svg>
    <span class="text-sm font-bold">چت آنلاین</span>
  </button>
</div>
<script>
  // صدا بعد از نمایش ویجت (اولین بار که FAB ظاهر می‌شود)
  (function(){
    if (window.LiveChatSound) {
      // کمی تاخیر تا مرورگر اجازه دهد (بعد از تعامل کاربر یا load)
      setTimeout(function(){ try { LiveChatSound.open(); } catch(e){} }, 400);
    }
  })();
</script>
