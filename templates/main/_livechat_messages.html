{% for m in messages %}
<div class="flex {% if m.is_from_visitor %}justify-start{% else %}justify-end{% endif %}">
  <div class="max-w-[85%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm
              {% if m.is_from_visitor %}
                bg-brand-blue-600 text-white rounded-br-md
              {% else %}
                bg-white text-slate-800 border border-slate-100 rounded-bl-md
              {% endif %}">
    {% if not m.is_from_visitor %}
    <div class="text-[10px] font-bold text-brand-blue-600 mb-0.5">
      {% if m.staff %}
        {{ m.staff.get_full_name|default:m.staff.username }}
      {% else %}
        پشتیبانی
      {% endif %}
    </div>
    {% endif %}
    <div class="whitespace-pre-wrap break-words">{{ m.text }}</div>
    <div class="text-[9px] opacity-60 mt-1 tabular-nums" dir="ltr">
      {{ m.created_at|time:"H:i" }}
    </div>
  </div>
</div>
{% empty %}
<p class="text-xs text-slate-400 text-center py-8">هنوز پیامی نیست.</p>
{% endfor %}
